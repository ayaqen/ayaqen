name: Inspect existing gist

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-gist-8fe05d.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch gist metadata and content
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/gists/8fe05d2d7222d309c079cdde6cec858c)

          description=$(printf '%s' "$response" | jq -r '.description // ""')
          owner=$(printf '%s' "$response" | jq -r '.owner.login // ""')
          public=$(printf '%s' "$response" | jq -r '.public')
          created=$(printf '%s' "$response" | jq -r '.created_at')
          updated=$(printf '%s' "$response" | jq -r '.updated_at')
          comments=$(printf '%s' "$response" | jq -r '.comments')
          forks=$(printf '%s' "$response" | jq -r '.forks | length')

          {
            echo '# Existing Gist Inspection'
            echo
            echo "- Owner: $owner"
            echo "- Public: $public"
            echo "- Description: $description"
            echo "- Created: $created"
            echo "- Updated: $updated"
            echo "- Comments: $comments"
            echo "- Forks returned: $forks"
            echo
            echo '## Files'
            echo
          } > GIST_INSPECTION.md

          printf '%s' "$response" | jq -r '.files | to_entries[] | "### `\(.key)`\n\n```\n\(.value.content // \"[content truncated or unavailable]\")\n```\n"' >> GIST_INSPECTION.md

      - name: Commit inspection result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GIST_INSPECTION.md
          git commit -m "Inspect existing gist 8fe05d"
          git push
