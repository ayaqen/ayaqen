name: Publish AI SaaS checklist gist

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-gist:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Find or create public gist
        id: gist
        env:
          GH_GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_GIST_TOKEN:-}" ]; then
            echo "Repository secret GIST_TOKEN is not configured."
            exit 1
          fi

          # Avoid creating a duplicate if the gist already exists.
          public_gists=$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/ayaqen/gists?per_page=100")

          gist_url=$(printf '%s' "$public_gists" | jq -r '
            map(select(
              .description == "A practical production-readiness checklist for AI SaaS founders and developers"
              or (.files | has("ai-saas-production-checklist.md"))
            ))
            | first
            | .html_url // empty
          ')

          if [ -z "$gist_url" ]; then
            payload=$(jq -n \
              --arg description "A practical production-readiness checklist for AI SaaS founders and developers" \
              --rawfile content AI_SAAS_PRODUCTION_CHECKLIST.md \
              '{
                description: $description,
                public: true,
                files: {
                  "ai-saas-production-checklist.md": {
                    content: $content
                  }
                }
              }')

            response=$(curl --fail-with-body --silent --show-error \
              --request POST \
              --url https://api.github.com/gists \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_GIST_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload")

            gist_url=$(printf '%s' "$response" | jq -r '.html_url // empty')
          fi

          if [ -z "$gist_url" ]; then
            echo "GitHub did not return a gist URL."
            exit 1
          fi

          printf '%s\n' "$gist_url" > GIST_URL.txt
          printf 'gist_url=%s\n' "$gist_url" >> "$GITHUB_OUTPUT"

      - name: Record gist URL
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GIST_URL.txt

          if git diff --cached --quiet; then
            echo "The existing gist URL is already recorded."
            exit 0
          fi

          git commit -m "Record AI SaaS checklist gist URL"
          git pull --rebase origin main
          git push origin main

      - name: Show result
        run: echo "Created or found ${{ steps.gist.outputs.gist_url }}"
