name: Publish AI SaaS checklist gist

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ai-saas-gist.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-gist:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Find or create public gist
        env:
          GH_GIST_TOKEN: ${{ secrets.METRICS_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail

          status_file="GIST_PUBLISH_STATUS.md"
          gist_url=""

          # Avoid duplicates if an earlier attempt created the gist but failed before recording its URL.
          public_gists=$(curl --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/ayaqen/gists?per_page=100")

          gist_url=$(printf '%s' "$public_gists" | jq -r '
            map(select(
              .description == "A practical production-readiness checklist for AI SaaS founders and developers"
              or (.files | has("ai-saas-production-checklist.md"))
            ))
            | first
            | .html_url // empty
          ')

          if [ -n "$gist_url" ]; then
            printf '# Gist published\n\n%s\n' "$gist_url" > "$status_file"
          elif [ -z "${GH_GIST_TOKEN:-}" ]; then
            printf '# Gist publishing failed\n\n`METRICS_TOKEN` is not configured.\n' > "$status_file"
          else
            payload=$(jq -n \
              --arg description "A practical production-readiness checklist for AI SaaS founders and developers" \
              --rawfile content AI_SAAS_PRODUCTION_CHECKLIST.md \
              '{
                description: $description,
                public: true,
                files: {
                  "ai-saas-production-checklist.md": {
                    content: $content
                  }
                }
              }')

            response_file=$(mktemp)
            http_code=$(curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --url https://api.github.com/gists \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_GIST_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload" || true)

            gist_url=$(jq -r '.html_url // empty' "$response_file" 2>/dev/null || true)

            if [ -n "$gist_url" ]; then
              printf '# Gist published\n\n%s\n' "$gist_url" > "$status_file"
            else
              api_message=$(jq -r '.message // "Unknown GitHub API error"' "$response_file" 2>/dev/null || printf 'Unknown GitHub API error')
              documentation_url=$(jq -r '.documentation_url // empty' "$response_file" 2>/dev/null || true)
              {
                printf '# Gist publishing failed\n\n'
                printf -- '- HTTP status: `%s`\n' "$http_code"
                printf -- '- GitHub message: `%s`\n' "$api_message"
                if [ -n "$documentation_url" ]; then
                  printf -- '- Documentation: %s\n' "$documentation_url"
                fi
              } > "$status_file"
            fi
          fi

      - name: Record result in repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GIST_PUBLISH_STATUS.md

          if git diff --cached --quiet; then
            echo "No result change to commit."
            exit 0
          fi

          git commit -m "Record AI SaaS gist publishing result"
          git pull --rebase origin main
          git push origin main
